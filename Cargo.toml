[package]
name = "horizon-overtune"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Overtune: a Spotify-style in-game music player, a native Horizon mod"

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/overtune/runtime.rs"

[workspace]
members = ["tools/audit"]
resolver = "2"
